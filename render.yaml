# Render Blueprint: https://render.com/docs/blueprint-spec
#
# One Postgres instance holds both databases:
#   zupa_production - created by this Blueprint
#   zupa_staging    - created manually: CREATE DATABASE zupa_staging;
#
# Values marked `sync: false` are secrets: Render prompts for them when the
# Blueprint is first created, then they are managed in the dashboard.
# Render passes env vars to `docker build` as build args, so REACT_* values
# get baked into the frontend bundle at build time.

databases:
  - name: zupa-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    # Default for this tier is 15 GB; the DB is a few MB. Disk can grow later, never shrink.
    diskSizeGB: 1
    databaseName: zupa_production

services:
  - type: web
    name: zupa-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      # Render sets WEB_CONCURRENCY by default, which puts Puma in cluster mode
      # with an extra master process; single mode fits the 512 MB instance better.
      - key: WEB_CONCURRENCY
        value: "0"
      - key: REACT_API_BASE_URL
        value: /api/v1
      - key: ACTIVE_STORAGE_SERVICE
        value: cloudflare
      - key: R2_BUCKET
        value: zupa-staging
      # Same instance as zupa-db, database name swapped to zupa_staging
      - key: DATABASE_URL
        sync: false
      - key: HOST
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
      - key: REACT_GTM_ID
        sync: false
      - key: REACT_APP_GOOGLE_MAPS_API_KEY
        sync: false
      - key: REACT_APP_USE_GOOGLE_MAPS_API
        sync: false
      - key: GOOGLE_DRIVE_PROJECT_ID
        sync: false
      - key: GOOGLE_DRIVE_PRIVATE_KEY_ID
        sync: false
      - key: GOOGLE_DRIVE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_CERT_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

  - type: web
    # Service name sets the onrender subdomain: https://zupa.onrender.com
    name: zupa
    runtime: docker
    # Always on (Starter, 0.5 CPU / 512 MB); the free plan sleeps after 15 min idle
    plan: starter
    region: frankfurt
    branch: production
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      # Render sets WEB_CONCURRENCY by default, which puts Puma in cluster mode
      # with an extra master process; single mode fits the 512 MB instance better.
      - key: WEB_CONCURRENCY
        value: "0"
      - key: REACT_API_BASE_URL
        value: /api/v1
      - key: ACTIVE_STORAGE_SERVICE
        value: cloudflare
      - key: R2_BUCKET
        value: zupa-production
      # Old domains, 301-redirected to HOST (see lib/legacy_host_redirect.rb).
      # They must also be added as custom domains on this service in Render.
      - key: REDIRECT_HOSTS
        value: zupa.lunarlogic.io,www.zupa.lunarlogic.io,zupa.lunarlogic.com,www.zupa.lunarlogic.com
      - key: DATABASE_URL
        fromDatabase:
          name: zupa-db
          property: connectionString
      - key: HOST
        sync: false
      - key: SECRET_KEY_BASE
        sync: false
      - key: REACT_GTM_ID
        sync: false
      - key: REACT_APP_GOOGLE_MAPS_API_KEY
        sync: false
      - key: REACT_APP_USE_GOOGLE_MAPS_API
        sync: false
      - key: GOOGLE_DRIVE_PROJECT_ID
        sync: false
      - key: GOOGLE_DRIVE_PRIVATE_KEY_ID
        sync: false
      - key: GOOGLE_DRIVE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_CERT_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
